<!DOCTYPE html>
<html>
<head>
    <title>Login</title>
    <style>
        body {
            background: #0f172a;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: Arial;
            color: white;
        }

        .box {
            background: #1e293b;
            padding: 40px;
            border-radius: 12px;
            width: 300px;
        }

        input {
            width: 100%;
            padding: 8px;
            margin-bottom: 15px;
            background: #334155;
            border: none;
            color: white;
        }

        button {
            width: 100%;
            padding: 10px;
            background: #3b82f6;
            border: none;
            color: white;
            border-radius: 6px;
        }
    </style>
</head>

<body>

<div class="box">
    <h2>Вход</h2>
    <form method="post" action="/login">
        <input name="username" placeholder="Логин" required>
        <input name="password" type="password" placeholder="Пароль" required>
        <button type="submit">Войти</button>
    </form>
</div>

</body>
</html>
